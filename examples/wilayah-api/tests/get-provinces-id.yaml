# Test scenario for GET /provinces/{id}
# Generated by `merapi test scaffold` — edited to use env vars and capture.

name: GET /provinces/{id}
steps:
  - name: fetch the default province
    request:
      method: GET
      path: /provinces/{{default_province}}
    expect:
      status: 200
      headers:
        Content-Type: application/json
      json:
        "$.id": "{{default_province}}"
        "$.code": "@exists"
        "$.name": "@exists"
    capture:
      province_code: "$.code"
  - name: unknown province is a documented 404
    request:
      method: GET
      path: /provinces/999999
      headers:
        X-Mock-Status: "404"
    expect:
      status: 404
      json:
        "$.code": "@exists"
        "$.message": "@exists"
