# Test scenario for GET /provinces/{id}/cities
# Generated by `merapi test scaffold` — edited with real assertions.

name: GET /provinces/{id}/cities
steps:
  - name: cities of the default province
    request:
      method: GET
      path: /provinces/{{default_province}}/cities
    expect:
      status: 200
      headers:
        Content-Type: application/json
      json:
        "$.count": "@exists"
        "$.data[0].id": "@exists"
        "$.data[0].name": "@exists"
        "$.data[0].provinceId": "{{default_province}}"
        "$.data[0].type": "@exists"
